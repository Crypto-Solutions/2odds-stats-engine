<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2Odds by Stats | Premium Football Selections</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        body { background-color: #060913 !important; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="text-white flex flex-col items-center min-h-screen p-4 md:p-8">

    <!-- Brand Header -->
    <div class="mb-8 text-center mt-6">
        <h1 class="text-3xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-green-400">⚽ 2ODDS BY STATS</h1>
        <p class="text-xs text-gray-400 mt-2 tracking-widest uppercase">Algorithmic Vetted Selections</p>
    </div>

    <!-- Main Booking Code Card -->
    <div class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl p-6 relative overflow-hidden mb-8">
        <div class="absolute top-0 left-0 right-0 h-[3px] bg-gradient-to-r from-green-400 to-emerald-400"></div>
        
        <div class="flex justify-between items-center mb-4">
            <span class="text-[11px] uppercase font-bold tracking-wider text-green-400 flex items-center gap-1.5">
                <span class="h-2 w-2 rounded-full bg-green-500 animate-pulse"></span> Today's Main Slip
            </span>
            <span id="slip-date" class="text-xs text-gray-300 font-bold bg-gray-950 px-2.5 py-1 rounded border border-gray-800">LOADING...</span>
        </div>

        <div class="border-t border-gray-800/80 pt-4 text-center">
            <p class="text-[10px] font-bold text-gray-400 tracking-widest uppercase mb-2">SportyBet Booking Code</p>
            <div class="flex items-center justify-between bg-black p-3 rounded-xl border border-gray-800">
                <span id="booking-code" class="text-xl font-mono font-black tracking-widest text-yellow-400 pl-3">-------</span>
                <button onclick="copyCode()" id="copy-btn" class="bg-green-500 hover:bg-green-600 text-black text-xs font-bold px-4 py-2.5 rounded-lg transition-all duration-150 shadow-lg shadow-green-500/20">
                    Copy Code
                </button>
            </div>
            <div class="mt-4 text-xs bg-gray-950 p-3 rounded-xl border border-gray-800/60 flex justify-between items-center">
                <span class="text-gray-400 font-medium">Combined Slip Odds:</span>
                <span id="combined-odds" class="text-green-400 font-black text-base">...</span>
            </div>
        </div>
    </div>

    <!-- 30 Matches Feed Area -->
    <div class="w-full max-w-md mb-12">
        <h2 class="text-xs font-bold uppercase tracking-widest text-gray-400 mb-4 pl-1 flex items-center gap-2">
            <span>📋</span> Daily High-Probability Feed
        </h2>
        <div id="fixtures-container" class="space-y-3.5">
            <p class="text-xs text-gray-400 text-center py-6 animate-pulse">Synchronizing match matrix data streams...</p>
        </div>
    </div>

    <script>
        const FEED_URL = "./data.json";

        async function initDashboard() {
            try {
                const res = await fetch(FEED_URL);
                const data = await res.json();
                
                document.getElementById('slip-date').innerText = data.date;
                document.getElementById('booking-code').innerText = data.main_booking_code;
                document.getElementById('combined-odds').innerText = data.combined_odds;
                
                const container = document.getElementById('fixtures-container');
                container.innerHTML = ""; 
                
                data.fixtures.forEach(match => {
                    const row = `
                        <div class="bg-gray-900 border border-gray-800/90 p-4 rounded-xl flex flex-col gap-1.5 shadow-md">
                            <div class="flex justify-between items-center text-[10px] font-bold tracking-wider">
                                <span class="text-gray-400 uppercase font-semibold">${match.league}</span>
                                <span class="text-green-400 bg-green-950/40 px-2.5 py-0.5 rounded-full border border-green-900/60">${match.win_chance} Win Chance</span>
                            </div>
                            <h3 class="font-extrabold text-white text-base my-0.5">${match.match_name}</h3>
                            <div class="flex justify-between text-xs border-t border-gray-800/50 pt-2 mt-0.5">
                                <span class="text-gray-400">Market: <strong class="text-emerald-400 font-bold">${match.market}</strong></span>
                                <span class="text-gray-400">Odds: <strong class="text-yellow-400 font-bold">${match.odds}</strong></span>
                            </div>
                        </div>
                    `;
                    container.innerHTML += row;
                });
            } catch (err) {
                document.getElementById('fixtures-container').innerHTML = `<p class="text-xs text-red-400 text-center py-4 bg-red-950/20 rounded-xl border border-red-900/30">Engine synchronization pending...</p>`;
            }
        }

        function copyCode() {
            const code = document.getElementById('booking-code').innerText;
            const btn = document.getElementById('copy-btn');
            if(code !== "-------") {
                navigator.clipboard.writeText(code);
                btn.innerText = "Copied! ✓";
                btn.classList.replace('bg-green-500', 'bg-emerald-600');
                btn.classList.replace('text-black', 'text-white');
                setTimeout(() => {
                    btn.innerText = "Copy Code";
                    btn.classList.replace('bg-emerald-600', 'bg-green-500');
                    btn.classList.replace('text-white', 'text-black');
                }, 2000);
            }
        }
        window.onload = initDashboard;
    </script>
</body>
</html>
