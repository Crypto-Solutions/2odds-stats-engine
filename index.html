<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2Odds by Stats | Algorithmic Selections</title>
    <script src="https://tailwindcss.com"></script>
    <style>body { background-color: #080c14; font-family: system-ui, -apple-system, sans-serif; }</style>
</head>
<body class="text-gray-100 flex flex-col items-center min-h-screen p-4 md:p-8">

    <!-- Header -->
    <div class="mb-8 text-center mt-4">
        <h1 class="text-3xl font-black tracking-wider text-white">⚽ 2ODDS BY STATS</h1>
        <p class="text-xs text-gray-500 mt-1.5 tracking-wide">High-Probability Vetted Fixtures</p>
    </div>

    <!-- Hero Booking Card -->
    <div class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl p-6 relative overflow-hidden mb-8">
        <div class="absolute top-0 left-0 right-0 h-[3px] bg-gradient-to-r from-green-500 to-emerald-400"></div>
        <div class="flex justify-between items-center mb-4">
          <span class="text-[11px] uppercase font-bold tracking-wider text-green-400 flex items-center gap-1.5">
            <span class="h-2 w-2 rounded-full bg-green-500 animate-pulse"></span> Today's Main Slip
          </span>
          <span id="slip-date" class="text-xs text-gray-400 font-medium">LOADING...</span>
        </div>
        <div class="border-t border-gray-800/60 pt-4 text-center">
          <p class="text-[10px] font-bold text-gray-400 tracking-widest uppercase mb-2">SportyBet Booking Code</p>
          <div class="flex items-center justify-between bg-black p-2.5 rounded-xl border border-gray-800">
            <span id="booking-code" class="text-xl font-mono font-black tracking-widest text-yellow-400 pl-3">-------</span>
            <button onclick="copyCode()" id="copy-btn" class="bg-green-500 hover:bg-green-600 text-black text-xs font-bold px-4 py-2.5 rounded-lg transition-all duration-150">
              Copy Code
            </button>
          </div>
          <div class="mt-4 text-xs text-gray-400 bg-gray-950/50 p-2.5 rounded-lg border border-gray-800/30 flex justify-between">
            <span>Combined Odds:</span>
            <span id="combined-odds" class="text-green-400 font-bold">...</span>
          </div>
        </div>
    </div>

    <!-- 30 Matches Feed Area -->
    <div class="w-full max-w-md">
        <h2 class="text-sm font-bold uppercase tracking-wider text-gray-400 mb-4 pl-1">Vetted Fixtures Feed</h2>
        <div id="fixtures-container" class="space-y-3">
            <p class="text-xs text-gray-600 text-center py-4">Connecting to data matrix stream...</p>
        </div>
    </div>

    <script>
        // Reads from the active location inside your repository
        const FEED_URL = "./data.json";

        async function initDashboard() {
            try {
                const res = await fetch(FEED_URL);
                const data = await res.json();
                
                document.getElementById('slip-date').innerText = data.date;
                document.getElementById('booking-code').innerText = data.main_booking_code;
                document.getElementById('combined-odds').innerText = data.combined_odds;
                
                const container = document.getElementById('fixtures-container');
                container.innerHTML = ""; 
                
                data.fixtures.forEach(match => {
                    const row = `
                        <div class="bg-gray-900 border border-gray-800/80 p-4 rounded-xl flex flex-col gap-1">
                            <div class="flex justify-between items-center text-[9px] font-bold uppercase tracking-wider">
                                <span class="text-gray-500">${match.league}</span>
                                <span class="text-green-400 bg-green-950/30 px-2 py-0.5 rounded border border-green-900/40">${match.win_chance} Win Chance</span>
                            </div>
                            <h3 class="font-bold text-gray-100 text-sm my-0.5">${match.match_name}</h3>
                            <div class="flex justify-between text-xs text-gray-400">
                                <span>Market: <strong class="text-emerald-400 font-medium">${match.market}</strong></span>
                                <span>Odds: <strong class="text-gray-200">${match.odds}</strong></span>
                            </div>
                        </div>
                    `;
                    container.innerHTML += row;
                });
            } catch (err) {
                document.getElementById('fixtures-container').innerHTML = `<p class="text-xs text-red-500 text-center">Engine update sync pending...</p>`;
            }
        }

        function copyCode() {
            const code = document.getElementById('booking-code').innerText;
            const btn = document.getElementById('copy-btn');
            if(code !== "-------") {
                navigator.clipboard.writeText(code);
                btn.innerText = "Copied! ✓";
                btn.classList.replace('bg-green-500', 'bg-emerald-600');
                setTimeout(() => {
                    btn.innerText = "Copy Code";
                    btn.classList.replace('bg-emerald-600', 'bg-green-500');
                }, 2000);
            }
        }
        window.onload = initDashboard;
    </script>
</body>
</html>
