<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2Odds by Stats</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #060914 !important; 
            color: #ffffff !important; 
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
            min-height: 100vh;
        }
        .app-container { width: 100%; max-width: 440px; }
        .brand-header { text-align: center; margin-top: 15px; margin-bottom: 25px; }
        .brand-title { font-size: 30px; font-weight: 800; color: #ffffff; }
        .brand-title span { color: #3b82f6; }
        .brand-subtitle { font-size: 10px; color: #64748b; margin-top: 6px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; }
        .glass-card { background-color: #111827 !important; border: 1px solid #1f2937 !important; border-radius: 20px; padding: 20px; margin-bottom: 24px; }
        .alpha-badge-line { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2937; padding-bottom: 12px; margin-bottom: 16px; }
        .alpha-title { font-size: 11px; font-weight: 800; color: #94a3b8; }
        .date-badge { font-size: 10px; color: #ffffff; background-color: #030712; border: 1px solid #1f2937; padding: 4px 10px; border-radius: 8px; font-weight: bold; }
        .match-row { background-color: #070a12; border: 1px solid #1f2937; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
        .league-header { display: flex; justify-content: space-between; font-size: 9px; font-weight: bold; text-transform: uppercase; margin-bottom: 6px; }
        .league-name { color: #64748b; }
        .win-chance-safe { color: #10b981; }
        .win-chance-feed { color: #3b82f6; }
        .team-names { font-size: 15px; font-weight: 800; color: #ffffff !important; margin-bottom: 8px; }
        .market-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #94a3b8; border-top: 1px solid rgba(31, 41, 55, 0.4); padding-top: 8px; }
        .market-text strong { color: #3b82f6; font-weight: 600; }
        .odds-value { color: #fbbf24 !important; font-weight: 800; background-color: #030712; padding: 3px 8px; border-radius: 6px; border: 1px solid #1f2937; }
        .multiplier-bar { display: flex; justify-content: space-between; align-items: center; background-color: #030712; border: 1px solid #1f2937; padding: 14px; border-radius: 14px; margin-top: 16px; }
        .multiplier-title { font-size: 11px; font-weight: bold; color: #94a3b8; }
        .multiplier-value { font-size: 22px; font-weight: 800; color: #10b981; }
        .feed-heading { font-size: 11px; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 14px; }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="brand-header">
            <h1 class="brand-title">2ODDS<span>BY</span>STATS</h1>
            <p class="brand-subtitle">Quantitative Football Forecast Matrix</p>
        </header>

        <!-- Top Safe Panel Component -->
        <section class="glass-card" style="border-top: 3px solid #3b82f6 !important;">
            <div class="alpha-badge-line">
                <div>
                    <h2 class="alpha-title">ALGORITHMIC ALPHA SLIP</h2>
                    <p style="font-size: 9px; color: #3b82f6; font-weight: bold; margin-top: 2px;">High Liquidity Minor Leagues Only</p>
                </div>
                <span id="slip-date" class="date-badge">LOADING...</span>
            </div>

            <div id="safe-legs-container">
                <p style="font-size: 12px; color: #64748b; text-align: center; padding: 10px;">Processing vector arrays...</p>
            </div>

            <div class="multiplier-bar">
                <span class="multiplier-title">COMPUTED MULTIPLIER</span>
                <span id="combined-odds" class="multiplier-value">...</span>
            </div>
        </section>

        <!-- Lower Feed Panel -->
        <main>
            <h3 class="feed-heading">📋 Global Probability Stream (30 Locked)</h3>
            <div id="fixtures-container">
                <p style="font-size: 12px; color: #64748b; text-align: center; padding: 20px;">Synchronizing database nodes...</p>
            </div>
        </main>
    </div>

    <script>
        const FEED_URL = "./data.json";

        async function initDashboard() {
            try {
                const res = await fetch(FEED_URL);
                const data = await res.json();
                
                document.getElementById('slip-date').innerText = data.date;
                document.getElementById('combined-odds').innerText = data.combined_odds;
                
                const safeContainer = document.getElementById('safe-legs-container');
                safeContainer.innerHTML = "";
                data.safe_fixtures.forEach(match => {
                    safeContainer.innerHTML += `
                        <div class="match-row">
                            <div class="league-header">
                                <span class="league-name">${match.league}</span>
                                <span class="win-chance-safe">🔥 ${match.win_chance} CONFIDENCE</span>
                            </div>
                            <div class="team-names">${match.match_name}</div>
                            <div class="market-meta">
                                <span class="market-text">Market: <strong>${match.market}</strong></span>
                                <span class="odds-value">${match.odds}</span>
                            </div>
                        </div>
                    `;
                });
                
                const container = document.getElementById('fixtures-container');
                container.innerHTML = ""; 
                data.fixtures.forEach(match => {
                    container.innerHTML += `
                        <div class="glass-card" style="padding: 16px; margin-bottom: 12px;">
                            <div class="league-header">
                                <span class="league-name">${match.league}</span>
                                <span class="win-chance-feed">🟢 ${match.win_chance} PASS</span>
                            </div>
                            <div class="team-names" style="font-size: 14px;">${match.match_name}</div>
                            <div class="market-meta" style="font-size: 11px; margin-top: 6px; padding-top: 6px;">
                                <span>Market: <strong>${match.market}</strong></span>
                                <span class="odds-value" style="font-size: 11px;">${match.odds}</span>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                document.getElementById('fixtures-container').innerHTML = `<p style="font-size: 11px; color: #ef4444; text-align: center;">Data Stream Sync Error</p>`;
            }
        }
        window.onload = initDashboard;
    </script>
</body>
</html>
