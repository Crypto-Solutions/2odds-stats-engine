<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2Odds by Stats</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117 !important; color: #ffffff !important; font-family: sans-serif; }
        .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .badge { background-color: #1f6feb; color: white; padding: 2px 8px; id-radius: 20px; font-size: 11px; font-weight: bold; }
        .btn-copy { background-color: #238636; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body style="padding: 20px; max-w: 480px; margin: 0 auto;">

    <!-- Brand Header -->
    <div style="text-align: center; margin-top: 20px; margin-bottom: 30px;">
        <h1 style="font-size: 28px; font-weight: 900; margin: 0; color: #58a6ff;">⚽ 2ODDS BY STATS</h1>
        <p style="font-size: 12px; color: #8b949e; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px;">Algorithmic Vetted Selections</p>
    </div>

    <!-- Main Slip Box -->
    <div class="card" style="border-top: 4px solid #238636;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <span style="color: #58a6ff; font-weight: bold; font-size: 13px;">🔥 TODAY'S MAIN SLIP</span>
            <span id="slip-date" style="font-size: 12px; color: #c9d1d9; font-weight: bold;">LOADING...</span>
        </div>
        
        <p style="font-size: 11px; color: #8b949e; text-transform: uppercase; margin-bottom: 5px; font-weight: bold;">SportyBet Booking Code</p>
        <div style="display: flex; justify-content: space-between; align-items: center; background: #0d1117; padding: 10px; border-radius: 8px; border: 1px solid #30363d;">
            <span id="booking-code" style="font-family: monospace; font-size: 20px; font-weight: 900; color: #ffd60a;">-------</span>
            <button onclick="copyCode()" id="copy-btn" class="btn-copy">Copy Code</button>
        </div>

        <div style="display: flex; justify-content: space-between; font-size: 13px; margin-top: 15px; background: #21262d; padding: 10px; border-radius: 8px; color: #c9d1d9;">
            <span>Combined Slip Odds:</span>
            <span id="combined-odds" style="color: #58a6ff; font-weight: bold;">...</span>
        </div>
    </div>

    <!-- Vetted Feed -->
    <h2 style="font-size: 14px; text-transform: uppercase; color: #8b949e; margin-top: 30px; margin-bottom: 15px; letter-spacing: 0.5px;">📋 Daily Fixtures Feed</h2>
    <div id="fixtures-container">
        <p style="font-size: 13px; color: #8b949e; text-align: center; padding: 20px;">Connecting to data stream...</p>
    </div>

    <script>
        const FEED_URL = "./data.json";

        async function initDashboard() {
            try {
                const res = await fetch(FEED_URL);
                const data = await res.json();
                
                document.getElementById('slip-date').innerText = data.date;
                document.getElementById('booking-code').innerText = data.main_booking_code;
                document.getElementById('combined-odds').innerText = data.combined_odds;
                
                const container = document.getElementById('fixtures-container');
                container.innerHTML = ""; 
                
                data.fixtures.forEach(match => {
                    const row = `
                        <div class="card">
                            <div style="display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 8px; font-weight: bold;">
                                <span style="color: #8b949e;">${match.league}</span>
                                <span style="color: #58a6ff;">🟢 ${match.win_chance} Win Chance</span>
                            </div>
                            <h3 style="font-size: 16px; font-weight: bold; margin: 5px 0; color: #ffffff;">${match.match_name}</h3>
                            <div style="display: flex; justify-content: space-between; font-size: 13px; border-top: 1px solid #30363d; pt-2; margin-top: 8px; padding-top: 8px; color: #c9d1d9;">
                                <span>Market: <strong style="color: #58a6ff;">${match.market}</strong></span>
                                <span>Odds: <strong style="color: #ffd60a;">${match.odds}</strong></span>
                            </div>
                        </div>
                    `;
                    container.innerHTML += row;
                });
            } catch (err) {
                document.getElementById('fixtures-container').innerHTML = `<p style="color: red; text-align: center;">Sync pending...</p>`;
            }
        }

        function copyCode() {
            const code = document.getElementById('booking-code').innerText;
            const btn = document.getElementById('copy-btn');
            if(code !== "-------") {
                navigator.clipboard.writeText(code);
                btn.innerText = "Copied! ✓";
                btn.style.backgroundColor = "#1f6feb";
                setTimeout(() => {
                    btn.innerText = "Copy Code";
                    btn.style.backgroundColor = "#238636";
                }, 2000);
            }
        }
        window.onload = initDashboard;
    </script>
</body>
</html>
